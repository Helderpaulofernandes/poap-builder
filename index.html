<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PoaP Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://unpkg.com/svg2pdf.js@2.2.3/dist/svg2pdf.umd.min.js"></script>
<script src="brand-logo.js"></script>
<style>
/* Layout: app shell. Branded toolbar on top, the A3 sheet in the middle, inspector on the right.
   Brand: Martinus navy + orange. The sheet stays paper-white in both themes because it is what gets issued. */
:root {
  --navy: #163E6B;
  --orange: #F47920;
  --bg: #EDF0F4;
  --panel: #FFFFFF;
  --fg: #14263D;
  --muted: #5A6A7E;
  --line: #D3DAE4;
  --accent: #163E6B;
  --accent-fg: #FFFFFF;
  --accent-2: #F47920;
  --hover: #E4EAF2;
  --danger: #B42318;
  --ok: #1F7A4D;
  --warn: #9A5B00;
  --paper: #FFFFFF;
  --font-ui: "Montserrat", "Segoe UI", Arial, sans-serif;
  --font-mono: "IBM Plex Mono", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1621; --panel: #16212F; --fg: #E3E9F1; --muted: #93A2B5; --line: #293A4E;
    --accent: #7FA8DA; --accent-fg: #0A1420; --accent-2: #F7944A; --hover: #1F2E40;
    --danger: #F07167; --ok: #5CC28F; --warn: #E2B04A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1621; --panel: #16212F; --fg: #E3E9F1; --muted: #93A2B5; --line: #293A4E;
  --accent: #7FA8DA; --accent-fg: #0A1420; --accent-2: #F7944A; --hover: #1F2E40;
  --danger: #F07167; --ok: #5CC28F; --warn: #E2B04A;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 500 12.5px/1.4 var(--font-ui); display: flex; flex-direction: column; }
button, input, select { font: inherit; color: inherit; }

/* ---------- toolbar ---------- */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding: 8px 16px; background: var(--panel); border-bottom: 3px solid var(--accent-2); }
.brand { display: flex; align-items: center; gap: 10px; margin-right: 4px; }
.brand .logo { background: #FFFFFF; border-radius: 3px; padding: 3px 5px; display: flex; }
.brand .logo img { height: 15px; max-width: 170px; object-fit: contain; display: block; }
.brandpick { display: flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--panel); border-radius: 4px; padding: 3px 7px 3px 3px; cursor: pointer; }
.brandpick:hover { background: var(--hover); }
.brandpick:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 1px; }
.brandpick .bname { font-size: 11.5px; font-weight: 600; color: var(--muted); max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.brandpick .caret { font-size: 10px; color: var(--muted); }
.brandlist { display: grid; gap: 6px; }
.brandrow { display: grid; grid-template-columns: 150px 1fr auto auto; gap: 12px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); cursor: pointer; text-align: left; }
.brandrow:hover { background: var(--hover); }
.brandrow[aria-current="true"] { border-color: var(--accent-2); box-shadow: inset 3px 0 0 var(--accent-2); }
.brandrow .lg { background: #FFFFFF; border-radius: 3px; height: 34px; display: grid; place-items: center; padding: 3px 6px; }
.brandrow .lg img { max-width: 100%; max-height: 28px; }
.brandrow .sw2 { display: flex; gap: 4px; }
.brandrow .sw2 i { width: 16px; height: 16px; border-radius: 3px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); }
.brand-preview { background: #FFFFFF; border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; display: grid; gap: 8px; color: #14263D; }
.brand-preview .ph { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.brand-preview .ph img { max-height: 34px; max-width: 55%; }
.brand-preview .band { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; font-size: 10px; font-weight: 600; text-align: center; }
.brand-preview .band span { padding: 3px 0; }
.brand b { font-weight: 700; font-size: 14px; letter-spacing: .01em; color: var(--accent); }
.brand span { font: 11px var(--font-mono); color: var(--muted); }
.grp { display: flex; gap: 4px; align-items: center; }
.grp + .grp { padding-left: 12px; border-left: 1px solid var(--line); }
.btn { border: 1px solid var(--line); background: var(--panel); padding: 5px 10px; border-radius: 3px; cursor: pointer; white-space: nowrap; font-weight: 500; }
.btn:hover { background: var(--hover); }
.btn:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 1px; }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.12); }
.btn.danger { color: var(--danger); }
.btn:disabled { opacity: .45; cursor: default; }
.zoom { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
.zoom input { width: 110px; accent-color: var(--accent-2); }
.spacer { flex: 1; }
/* save status: grey = not saved, amber = changes waiting, blue = saving, green = saved */
.status { display: flex; align-items: center; gap: 7px; padding: 3px 4px 3px 10px; border: 1px solid var(--line); border-radius: 99px; font-size: 12px; font-weight: 600; color: var(--muted); max-width: 100%; min-width: 0; }
.status span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.status i { width: 8px; height: 8px; border-radius: 50%; background: #9AA6B5; flex: none; }
.status[data-state="saved"] { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, var(--line)); }
.status[data-state="saved"] i { background: var(--ok); }
.status[data-state="pending"] { color: var(--warn); }
.status[data-state="pending"] i { background: #E0A100; }
.status[data-state="saving"] i { background: var(--accent); animation: pulse 1s ease-in-out infinite; }
.status[data-state="none"] { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, var(--line)); }
.status[data-state="none"] i { background: var(--danger); }
.status .btn { padding: 2px 10px; border-radius: 99px; font-size: 11.5px; }
.status:not(:has(.btn:not([hidden]))) { padding-right: 10px; }
@keyframes pulse { 50% { opacity: .3; } }

/* ---------- main ---------- */
main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0,1fr) 300px; }
.stage { overflow: auto; padding: 16px; min-width: 0; }
.sheet { background: var(--paper); box-shadow: 0 1px 4px rgba(10,20,40,.2); display: inline-block; }
/* page view: the sheet sits on a sheet of paper at the printed size and margins */
.paper { position: relative; background: #FFFFFF; box-shadow: 0 2px 12px rgba(10,20,40,.28); margin: 0 auto; flex: none; }
.paper .sheet { position: absolute; box-shadow: none; display: block; }
.paper .sheet svg { display: block; }
.paper.free { position: static; background: none; box-shadow: none; margin: 0; }
.paper.free .sheet { position: static; display: inline-block; box-shadow: 0 1px 4px rgba(10,20,40,.2); }
.pageinfo { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; margin: 0 auto 10px; font-size: 12px; color: var(--muted); font-weight: 600; }
.pagewarn { color: var(--warn); }
.pagewarn::before { content: "⚠ "; }
#chart { display: block; user-select: none; touch-action: none; }
.hint { margin: 10px 2px 0; color: var(--muted); font-size: 12px; max-width: 900px; }
.hint kbd { font: 11px var(--font-mono); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; background: var(--panel); }

aside { background: var(--panel); border-left: 1px solid var(--line); overflow: auto; padding: 14px 16px 24px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
aside h2 { margin: 6px 0 0; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); display: flex; align-items: center; gap: 8px; }
aside h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }
aside h2:first-child { margin-top: 0; }
.f { display: grid; gap: 3px; }
.f label { font-size: 10.5px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.f input, .f select { width: 100%; padding: 5px 7px; border: 1px solid var(--line); border-radius: 3px; background: var(--bg); font-weight: 500; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.f input[type=color] { padding: 1px 2px; height: 30px; }
.idtag { font: 500 12px var(--font-mono); background: var(--hover); padding: 2px 6px; border-radius: 3px; letter-spacing: 0; text-transform: none; color: var(--fg); }
.actions { display: flex; flex-wrap: wrap; gap: 6px; }
.swatches { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.sw { width: 26px; height: 26px; border-radius: 3px; border: 2px solid transparent; cursor: pointer; padding: 0; box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); }
.sw[aria-pressed="true"] { border-color: var(--fg); }
.swatches input[type=color] { width: 30px; height: 26px; border: 1px solid var(--line); padding: 0; background: none; }
.preview { display: flex; gap: 6px; align-items: center; font-size: 11px; color: var(--muted); }
.preview i { display: inline-block; width: 44px; height: 14px; border: 1px solid #163E6B; }
.legend { display: grid; gap: 6px; }
.legend div { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: center; }
.legend input[type=text] { padding: 3px 6px; border: 1px solid var(--line); border-radius: 3px; background: var(--bg); width: 100%; font-size: 12px; }
.legend input[type=color] { width: 30px; height: 22px; border: 1px solid var(--line); padding: 0; background: none; }
.types { display: grid; gap: 2px; }
.type { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: center; text-align: left; padding: 5px 6px; border: 1px solid transparent; border-radius: 3px; background: none; cursor: pointer; }
.type:hover { background: var(--hover); border-color: var(--line); }
.type small { color: var(--muted); font-family: var(--font-mono); font-size: 11px; }
.type-preview { background: #FFFFFF; border: 1px solid var(--line); border-radius: 3px; padding: 6px 8px; }
.check { display: flex; gap: 6px; align-items: center; font-size: 12px; }
.logo-slot { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.tagfmt { display: grid; gap: 10px; padding: 10px; border: 1px solid var(--line); border-radius: 4px; }
.seg { display: flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
.seg button { flex: 1; border: 0; border-right: 1px solid var(--line); background: var(--bg); padding: 5px 6px; font-size: 11.5px; font-weight: 600; cursor: pointer; color: var(--muted); }
.seg button:last-child { border-right: 0; }
.seg button:hover { background: var(--hover); color: var(--fg); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.seg button:focus-visible { outline: 2px solid var(--accent-2); outline-offset: -2px; }
.seg input[type=color] { width: 34px; flex: none; border: 0; padding: 0 3px; background: var(--bg); cursor: pointer; }
.logo-editor { display: grid; gap: 12px; }
.logo-editor canvas { width: 100%; max-width: 498px; aspect-ratio: 166 / 54; border: 1px dashed #8794A6; background: #FFFFFF; cursor: grab; touch-action: none; justify-self: center; }
.logo-editor canvas:active { cursor: grabbing; }
.logo-slot .thumb { width: 92px; height: 34px; border: 1px dashed var(--line); border-radius: 3px; background: #FFFFFF; display: grid; place-items: center; overflow: hidden; color: #8794A6; font-size: 10px; }
.logo-slot .thumb img { max-width: 100%; max-height: 100%; }
.note { font-size: 11.5px; color: var(--muted); margin: 0; }

/* ---------- modal ---------- */
.modal { position: fixed; inset: 0; background: rgba(8,14,24,.45); display: grid; place-items: center; padding: 16px; z-index: 10; }
.dlg { background: var(--panel); border-radius: 4px; width: min(720px, 100%); max-height: 85vh; display: flex; flex-direction: column; box-shadow: 0 10px 40px rgba(0,0,0,.3); border-top: 3px solid var(--accent-2); }
.dlg header { padding: 14px 18px; border-bottom: 1px solid var(--line); }
.dlg header h3 { margin: 0; font-size: 15px; font-weight: 700; color: var(--accent); }
.dlg header p { margin: 4px 0 0; color: var(--muted); }
.dlg .body { padding: 12px 18px; overflow: auto; }
.dlg footer { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.chip { padding: 3px 9px; border-radius: 99px; font-size: 12px; font-weight: 600; border: 1px solid currentColor; }
.chip.chg { color: var(--accent); } .chip.new { color: var(--ok); } .chip.miss { color: var(--warn); } .chip.err { color: var(--danger); }
table.diff { border-collapse: collapse; width: 100%; font-size: 12px; }
table.diff td, table.diff th { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.diff th { font-weight: 700; color: var(--muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; }
table.diff td:first-child { font-family: var(--font-mono); white-space: nowrap; }
.old { color: var(--muted); text-decoration: line-through; }
/* ---------- start screen: sits under modals (z 10) so branding and save dialogs open over it ---------- */
.startscreen { position: fixed; inset: 0; z-index: 9; display: grid; place-items: center; padding: 16px; background: rgba(8,14,24,.28); backdrop-filter: blur(7px) saturate(.8); -webkit-backdrop-filter: blur(7px) saturate(.8); overflow: auto; }
.startcard { background: var(--panel); border-radius: 6px; width: min(560px, 100%); box-shadow: 0 18px 60px rgba(0,0,0,.35); border-top: 4px solid var(--accent-2); padding: 20px 22px 18px; }
.starthead { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.starthead h2 { margin: 0 0 2px; font-size: 20px; font-weight: 700; color: var(--accent); }
.startcard .brandpick .logo { background: #FFFFFF; border-radius: 3px; padding: 3px 5px; display: flex; }
.startcard .brandpick .logo img { height: 18px; max-width: 150px; object-fit: contain; display: block; }
.choices { display: grid; gap: 8px; }
.choice { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 11px 14px; border: 1px solid var(--line); border-radius: 5px; background: var(--panel); cursor: pointer; }
.choice svg { flex: none; color: var(--accent); }
.choice b { display: block; font-size: 13.5px; }
.choice:hover { background: var(--hover); border-color: var(--accent-2); }
.choice:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 1px; }
.choice.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.choice.primary svg, .choice.primary .note { color: inherit; opacity: .85; }
.choice.primary:hover { filter: brightness(1.12); background: var(--accent); }
.warnnote { margin-top: 12px; }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 3px; font-size: 12px; z-index: 20; }

@media (max-width: 860px) {
  main { grid-template-columns: 1fr; grid-template-rows: minmax(0,1fr) auto; }
  aside { border-left: 0; border-top: 1px solid var(--line); max-height: 45vh; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="bar">
  <div class="brand">
    <button type="button" class="brandpick" id="bBrand" title="Change branding: logo and colours (joint ventures, alliances)" aria-haspopup="dialog">
      <span class="logo"><img id="brandLogo" alt=""></span><span class="bname" id="brandName"></span><span class="caret" aria-hidden="true">▾</span>
    </button>
    <b>PoaP Builder</b><span id="docName"></span>
  </div>
  <div class="status" id="saveStatus" data-state="none" role="status" aria-live="polite"><i aria-hidden="true"></i><span id="saved"></span><button class="btn" id="bSaveNow" hidden>Save now</button></div>
  <div class="grp">
    <button class="btn" id="bLane" title="Add a swimlane">+ Lane</button>
    <button class="btn" id="bBar" title="Add a bar to the selected lane">+ Bar</button>
    <button class="btn" id="bMs" title="Add a milestone to the selected lane">+ Milestone</button>
    <button class="btn" id="bCurtain" title="Add a shaded date range across all lanes: contingency, saving or allowance">+ Curtain</button>
  </div>
  <div class="grp">
    <button class="btn" id="bUndo" title="Undo (Ctrl+Z)">Undo</button>
    <button class="btn" id="bRedo" title="Redo (Ctrl+Y)">Redo</button>
  </div>
  <div class="grp zoom">
    <label for="viewMode">View</label>
    <select id="viewMode" title="Page views show the sheet exactly as it prints">
      <option value="page-width">Page · fit width</option>
      <option value="page-fit">Page · whole page</option>
      <option value="page-100">Page · 100%</option>
      <option value="free">Free zoom</option>
    </select>
    <span id="zoomBox"><input id="zoom" type="range" min="1" max="12" step="0.5" aria-label="Zoom"></span>
    <button class="btn" id="bFit" title="Set the timeline to cover all items">Fit dates</button>
  </div>
  <div class="spacer"></div>
  <div class="grp">
    <button class="btn" id="bNew">New</button>
    <button class="btn" id="bOpen" title="Open a saved project (.json) or a programme workbook (.xlsx)">Open…</button>
    <button class="btn" id="bSave" title="Save the project file (.json)">Save</button>
  </div>
  <div class="grp">
    <button class="btn" id="bImport" title="Update dates from an edited Excel workbook">Update from Excel…</button>
    <button class="btn" id="bExport">Export Excel</button>
    <button class="btn primary" id="bPdf">Export PDF</button>
    <button class="btn" id="bIssue" title="Save this revision's PDF and Excel to the Issued folder in the library" hidden>Issue</button>
  </div>
  <input type="file" id="fOpen" accept=".json,.xlsx,.xlsm,.xls" hidden>
  <input type="file" id="fImport" accept=".xlsx,.xlsm,.xls" hidden>
  <input type="file" id="fLogo" accept="image/png,image/jpeg,image/svg+xml,image/webp" hidden>
</div>

<main>
  <div class="stage" id="stage">
    <div class="pageinfo" id="pageInfo"><span id="pageLabel"></span><span class="pagewarn" id="pageWarn" hidden></span></div>
    <div class="paper" id="paper"><div class="sheet" id="sheet"><svg id="chart" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"></svg></div></div>
    <p class="hint">Drag a bar to move it in time or to another row or lane. Drag a bar's ends to change its start or finish. Double-click an empty spot in a lane to add a bar there. Click a lane title to change its colour. <kbd>Del</kbd> deletes, <kbd>Ctrl+D</kbd> duplicates, <kbd>←</kbd>/<kbd>→</kbd> nudge 1 day (<kbd>Shift</kbd> = 1 week).</p>
  </div>
  <aside id="side"></aside>
</main>

<script>
"use strict";
/* Optional host. Opened as a plain file there is none; inside SharePoint the web part supplies
   storage (list/read/write files in a library), bundled libraries, fonts and the logo. */
const HOST = window.POAP_HOST || null;
const ROOT = (HOST && HOST.root) || document.body;
/* ---------------------------------------------------------------------
   Brand assets + sheet geometry (px at screen scale; the PDF scales the whole sheet to A3)
   --------------------------------------------------------------------- */
const MARTINUS_LOGO = (HOST && HOST.logo) || window.POAP_BRAND_LOGO || "";   // from brand-logo.js
const LOGO_RATIO = 260 / 35;
const BRAND = { navy: "#163E6B", orange: "#F47920", ink: "#14263D", grid: "#C9D2DD" };
const LOGO_BOX = { x: 12, y: 10, w: 166, h: 54 };   // client logo area in the sheet header (px)
const G = { headW: 46, hdrH: 74, topH: 40, botH: 40, ftrH: 48, rowH: 26, pad: 6, barH: 16, ms: 12 };
/* row spacing: bars, markers and lane padding scale with the row height the user picks */
const SPACING = [["compact", "Compact", 18], ["normal", "Normal", 26], ["roomy", "Roomy", 34]];
function applySpacing() {
  const r = Math.max(14, Math.min(40, +P.page.rowH || 26));
  G.rowH = r;
  G.barH = Math.round(Math.max(10, Math.min(18, r * .62)));
  G.ms = Math.round(Math.max(8, Math.min(13, r * .46)));
  G.pad = Math.round(Math.max(2, Math.min(8, r * .22)));
}
const inlineMsDate = () => G.rowH < 22;   // tight rows: milestone date goes on the name's line
/* lane colour presets: the brand's two colours first, then a fixed set */
const LANE_PRESETS_FIXED = [["Steel blue", "#4F7CAC"], ["Teal", "#128A84"], ["Green", "#5E9A35"], ["Purple", "#6E4E9E"], ["Red", "#C8102E"], ["Grey", "#6F7C8C"]];
const lanePresets = () => [["Brand accent", BRAND.orange], ["Brand main colour", BRAND.navy], ...LANE_PRESETS_FIXED];

/* ---------- branding: logo + main colour + accent colour; a programme carries its brand (P.brand) ---------- */
const DEFAULT_BRAND = { id: "martinus", name: "Martinus", logo: "", ratio: LOGO_RATIO, primary: "#163E6B", accent: "#F47920" };
const BRANDS_KEY = "poap-builder-brands";
const currentBrand = () => { try { return (P && P.brand) || DEFAULT_BRAND; } catch (e) { return DEFAULT_BRAND; } };   // P may not exist yet at start-up
const brandLogoSrc = b => (b || currentBrand()).logo || MARTINUS_LOGO;
const brandRatio = b => (b || currentBrand()).logo ? ((b || currentBrand()).ratio || 4) : LOGO_RATIO;
/* mix with black: t=0 original, t=1 black */

/* Build a project from spreadsheet-style rows. Shared by the sample and Excel import. */
function projectFromRows(rows, laneRows, base) {
  const p = base || blankProject();
  const laneByName = new Map(p.lanes.map(l => [l.name.toLowerCase(), l]));
  const ensureLane = name => {
    name = (name || "Unassigned").trim();
    let l = laneByName.get(name.toLowerCase());
    if (!l) { l = newLane(p, name); laneByName.set(name.toLowerCase(), l); }
    return l;
  };
  (laneRows || []).forEach(lr => { const l = ensureLane(lr.name); if (lr.colour) l.colour = lr.colour; if (lr.minRows) l.minRows = lr.minRows; });
  const seen = new Set(p.items.map(i => i.id));
  const reserved = new Set(rows.map(r => (r.id || "").trim()).filter(Boolean));
  const yGroups = new Map();
  for (const r of rows) {
    const st = styleOf(p, r.style), curtain = st.behaviour === "Curtain";
    const lane = curtain ? { id: "" } : ensureLane(r.lane);   // curtains span every lane
    let id = (r.id || "").trim() || nextId(p, r.style, null, reserved);
    if (seen.has(id)) id = nextId(p, r.style, id, reserved);
    seen.add(id);
    const it = { id, name: r.name || "", style: st.name, lane: lane.id, start: r.start, end: isMs(p, st.name) ? r.start : (r.end || r.start), status: r.status || "Active", row: curtain ? 0 : Number.isFinite(r.row) ? r.row : null, fill: r.fill || "", stroke: r.stroke || "" };
    if (r.parent) it.parent = r.parent;
    if (r.collapsed) it.collapsed = true;
    if (r.labelMode && r.labelMode !== "auto") it.labelMode = r.labelMode;
    if (r.pct && !curtain) it.pct = r.pct;
    if (r.bStart && !curtain) { it.bStart = r.bStart; it.bEnd = isMs(p, st.name) ? r.bStart : (r.bEnd || r.bStart); }
    p.items.push(it);
    if (it.row == null && Number.isFinite(r.y)) { (yGroups.get(lane.id) || yGroups.set(lane.id, []).get(lane.id)).push([it, r.y]); }
  }
  // Visio Y_mm -> row index: 7 mm stack step, highest Y is the top row
  for (const list of yGroups.values()) {
    const top = Math.max(...list.map(x => x[1]));
    list.forEach(([it, y]) => it.row = Math.max(0, Math.round((top - y) / 7)));
  }
  p.items.filter(i => i.row == null).forEach(i => i.row = freeRow(p, i));
  syncContainers(p);
  return p;
}

    const clash = p.items.some(o => o !== it && o.lane === it.lane && onRow(o, r) && (([c, d]) => c < b && a < d)(sp(o)));
    if (!clash) return r;
  }
  return 0;
}

document.addEventListener("keydown", e => {
  if (e.target.closest("input,select,textarea")) return;
  const k = e.key.toLowerCase();
  if ((e.ctrlKey || e.metaKey) && k === "z") { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if ((e.ctrlKey || e.metaKey) && k === "y") { e.preventDefault(); redo(); return; }
  if ((e.ctrlKey || e.metaKey) && k === "s") { e.preventDefault(); saveDoc(); return; }
  if (e.key === "Escape") { sel = null; render(); renderSide(); return; }
  if (!sel || sel.type !== "item") return;
  const it = P.items.find(i => i.id === sel.id); if (!it) return;
  if (e.key === "Delete" || e.key === "Backspace") { e.preventDefault(); commit(p => p.items = p.items.filter(i => i.id !== it.id)); sel = null; renderSide(); }
  if ((e.ctrlKey || e.metaKey) && k === "d") { e.preventDefault(); const c = { ...clone(it), id: nextId(P, it.style, it.id) }; c.row = freeRow(P, c); commit(p => p.items.push(c)); sel = { type: "item", id: c.id }; render(); renderSide(); }
  if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
    e.preventDefault(); const n = (e.key === "ArrowLeft" ? -1 : 1) * (e.shiftKey ? 7 : 1);
    commit(p => { const x = p.items.find(i => i.id === it.id); x.start = addDays(x.start, n); x.end = addDays(x.end, n); }, true);
  }
});

/* inspector: % complete (milestones: done or not), baseline dates and how far they've moved */
function progressFields(cur) {
  const ms = isMs(P, cur.style), dd = prog().dataDate;
  if (isContainer(P, cur)) {
    const kids = containerChildren(P, cur).filter(k => tracked(k) && !isMs(P, k.style));
    return `<h2>Progress</h2>${kids.length ? `<p class="note">${rollupPct(cur)}% complete, from its ${kids.length} bar${kids.length === 1 ? "" : "s"} weighted by duration.</p>` : ""}${baselineFields(cur, false)}`;
  }
  const p = pctOf(cur);
  let state = "";
  if (dd) { const v = Math.round(progressPoint(cur, ddPoint()) - ddPoint()); state = v < 0 ? `${-v} day${v === -1 ? "" : "s"} behind at the data date` : v > 0 ? `${v} day${v === 1 ? "" : "s"} ahead at the data date` : "On track at the data date"; }
  return `<h2>Progress</h2>
    ${ms ? `<label class="check"><input type="checkbox" id="iDone" ${p >= 100 ? "checked" : ""}> Achieved</label>`
      : `<div class="f"><label for="iPct">Complete: <span id="iPctVal">${p}</span>%</label>
        <div style="display:flex;gap:8px;align-items:center"><input id="iPct" type="range" min="0" max="100" step="5" value="${p}" style="flex:1;accent-color:var(--accent-2)"><input id="iPctN" type="number" min="0" max="100" value="${p}" style="width:58px" aria-label="Percent complete"></div></div>`}
    ${state ? `<p class="note">${state}.</p>` : ""}
    ${baselineFields(cur, ms)}`;
}
function baselineFields(cur, ms) {
  const has = !!cur.bStart;
  const fin = has ? toDays(cur.end) - toDays(cur.bEnd || cur.bStart) : 0, st = has ? toDays(cur.start) - toDays(cur.bStart) : 0;
  return `<div class="row2">
      <div class="f"><label for="iBStart">${ms ? "Baseline date" : "Baseline start"}</label><input id="iBStart" type="date" value="${cur.bStart || ""}"></div>
      ${ms ? "" : `<div class="f"><label for="iBEnd">Baseline finish</label><input id="iBEnd" type="date" value="${cur.bEnd || ""}"></div>`}
    </div>
    <p class="note">${has ? (ms ? `${signedDays(st)} against the baseline.` : `Starts ${signedDays(st)}, finishes ${signedDays(fin)} against the baseline.`) : "No baseline yet. Set one for the whole programme from the Progress section (click an empty part of the sheet)."}</p>`;
}
function bindProgressFields(cur) {
  const upd = f => commit(p => f(p.items.find(i => i.id === cur.id)), true);
  const setPct = v => upd(x => { v = Math.max(0, Math.min(100, Math.round(+v || 0))); if (v) x.pct = v; else delete x.pct; if (v >= 100) x.status = "Complete"; else if (x.status === "Complete") x.status = "Active"; });
  if ($("iPct")) {
    $("iPct").oninput = e => { $("iPctVal").textContent = e.target.value; $("iPctN").value = e.target.value; };
    $("iPct").onchange = e => setPct(e.target.value);
    $("iPctN").onchange = e => setPct(e.target.value);
  }
  if ($("iDone")) $("iDone").onchange = e => setPct(e.target.checked ? 100 : 0);
  if ($("iBStart")) $("iBStart").onchange = e => upd(x => {
    const v = e.target.value; if (!v) { delete x.bStart; delete x.bEnd; return; }
    if (isMs(P, x.style)) { x.bStart = x.bEnd = v; return; }
    const d = x.bStart && x.bEnd ? toDays(x.bEnd) - toDays(x.bStart) : toDays(x.end) - toDays(x.start);
    x.bStart = v; if (!x.bEnd || toDays(x.bEnd) < toDays(v)) x.bEnd = addDays(v, d);
  });
  if ($("iBEnd")) $("iBEnd").onchange = e => upd(x => { const v = e.target.value; if (!v) return; if (!x.bStart) x.bStart = x.start; x.bEnd = toDays(v) < toDays(x.bStart) ? x.bStart : v; });
}

/* the next revision: A → B, Z → AA, 3 → 4, P1 → P2 */
function nextRevision(rev) {
  const s = String(rev || "").trim();
  let m = s.match(/^(.*?)(\d+)$/); if (m) return m[1] + (+m[2] + 1);
  m = s.match(/^(.*?)([A-Za-z])$/);
  if (m) { const c = m[2]; return c === "Z" ? m[1] + "AA" : c === "z" ? m[1] + "aa" : m[1] + String.fromCharCode(c.charCodeAt(0) + 1); }
  return s ? s + "1" : "A";
}
/* A progress update: this whole programme becomes the plan (the baseline) of a new copy, which is then
   progressed as the actual. The copy is the next revision and is saved as its own file; this one stays as it is. */
function startProgressUpdate() {
  const rev = P.meta.revision || "", next = nextRevision(rev), had = P.items.some(i => i.bStart);
  showModal(`<header><h3>New progress update</h3><p>A copy of this programme becomes the progressed version. Its current dates become the planned baseline, shown as a narrow grey bar under each activity, and the copy's bars become the actual dates you update. This programme (Rev ${esc(rev)}) stays as it is.</p></header>
    <div class="body">
      <div class="row2">
        <div class="f"><label for="puRev">New revision</label><input id="puRev" value="${esc(next)}"></div>
        <div class="f"><label for="puDate">Data date</label><input id="puDate" type="date" value="${prog().dataDate && toDays(prog().dataDate) > toDays(todayISO()) ? prog().dataDate : todayISO()}"></div>
      </div>
      <div class="f"><label for="puName">Baseline name (in the legend)</label><input id="puName" value="${esc(`Planned (Rev ${rev})`)}"></div>
      ${had ? `<label class="check"><input type="checkbox" id="puKeep"> Keep the existing baseline instead (“${esc(prog().baselineName || "Baseline")}”)</label>` : ""}
      <label class="check"><input type="checkbox" id="puPct" checked> Carry over the % complete recorded so far</label>
    </div>
    <footer><span class="spacer" style="flex:1"></span><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="go">Create and save the update</button></footer>`, {
    go: m => {
      const v = id => m.querySelector(id), keep = v("#puKeep")?.checked;
      const p = clone(P);
      p.items.forEach(i => {
        if (isCurtain(p, i.style)) return;
        if (!keep) { i.bStart = i.start; i.bEnd = i.end; }
        if (!v("#puPct").checked) { delete i.pct; if (i.status === "Complete") i.status = "Active"; }
      });
      p.meta.revision = v("#puRev").value.trim() || next;
      p.meta.date = todayISO();
      p.progress = { ...prog(), dataDate: v("#puDate").value || todayISO(), line: true, bars: true, baseline: true,
        ...(keep ? {} : { baselineName: v("#puName").value.trim(), baselineSet: todayISO() }) };
      loadDoc(p, null);
      toast(`Rev ${p.meta.revision} created from Rev ${rev}. Choose where to save it.`, 5000);
      saveDoc();
    },

}

/* another programme's dates (an earlier revision, say) become the baseline, matched by ShapeID */
async function baselineFromFile(f) {
  let rows;
  if (/\.json$/i.test(f.name)) { const p = JSON.parse(await f.text()); if (p.format !== "poap/2") throw new Error("this file isn't a PoaP Builder project"); rows = p.items; }
  else rows = parseWorkbook(await f.arrayBuffer()).rows;
  const byId = new Map(rows.filter(r => r.id).map(r => [r.id, r]));
  const hits = P.items.filter(i => !isCurtain(P, i.style) && byId.has(i.id));
  if (!hits.length) return toast(`None of the ShapeIDs in ${f.name} match this programme, so no baseline was set.`, 6000);
  commit(p => {
    p.items.forEach(i => { const r = byId.get(i.id); if (!r || isCurtain(p, i.style)) return; i.bStart = r.start; i.bEnd = isMs(p, i.style) ? r.start : (r.end || r.start); });
    p.progress = { ...prog(), ...(p.progress || {}), baseline: true, baselineSet: todayISO(), baselineName: prog().baselineName || f.name.replace(/\.(poap\.json|json|xlsx|xlsm|xls)$/i, "") };
  }, true);
  const missed = P.items.filter(i => !isCurtain(P, i.style)).length - hits.length;
  toast(`Baseline set for ${hits.length} item${hits.length === 1 ? "" : "s"} from ${f.name}${missed ? `; ${missed} not in that file have no baseline` : ""}.`, 6000);
}

    const st = styleOf(lookup, r.style).name, ms = isMs(lookup, st), end = ms ? r.start : r.end;
    const diffs = [];
    if (r.name && r.name !== cur.name) diffs.push(["Name", cur.name, r.name]);
    if (r.start !== cur.start) diffs.push([ms ? "Date" : "Start", fmt(cur.start), fmt(r.start)]);
    if (!ms && end !== cur.end) diffs.push(["Finish", fmt(cur.end), fmt(end)]);
    if (st !== cur.style) diffs.push(["Style", cur.style, st]);
    if (r.lane && r.lane.toLowerCase() !== laneName(cur.lane).toLowerCase()) diffs.push(["Lane", laneName(cur.lane), r.lane]);
    if (r.status && r.status !== cur.status) diffs.push(["Status", cur.status, r.status]);
    if (r.parent !== undefined && (r.parent || "") !== (cur.parent || "")) diffs.push(["Summary", cur.parent || "(none)", r.parent || "(none)"]);
    if (r.collapsed !== undefined && !!r.collapsed !== !!cur.collapsed) diffs.push(["Collapsed", cur.collapsed ? "Yes" : "No", r.collapsed ? "Yes" : "No"]);
    // progress and baseline (a summary's progress is worked out from its bars, so it isn't read back)
    const trackedRow = !isCurtain(lookup, st) && !/^container/.test(styleOf(lookup, st).shape);
    if (trackedRow && r.pct !== undefined && r.pct !== pctOf(cur)) diffs.push(["Progress", pctOf(cur) + "%", r.pct + "%"]);
    if (trackedRow && r.bStart !== undefined) {
      const bEnd = r.bStart ? (ms ? r.bStart : r.bEnd || r.bStart) : "";
      if ((r.bStart || "") !== (cur.bStart || "")) diffs.push([ms ? "Baseline date" : "Baseline start", cur.bStart ? fmt(cur.bStart) : "(none)", r.bStart ? fmt(r.bStart) : "(none)"]);
      if (!ms && r.bStart && bEnd !== (cur.bEnd || "")) diffs.push(["Baseline finish", cur.bEnd ? fmt(cur.bEnd) : "(none)", fmt(bEnd)]);
    }
    if (diffs.length) changes.push({ r, cur, diffs });
  }
  const ddNew = parsed.progress ? parsed.progress.dataDate : undefined, ddChange = ddNew !== undefined && ddNew !== prog().dataDate;
  const missing = P.items.filter(i => !seen.has(i.id));

  // lanes: the Lanes sheet sets which lanes exist, their order and colour
  const sheetLanes = parsed.lanes || [], key = s => String(s || "").trim().toLowerCase();
  const rowLanes = new Set(parsed.rows.filter(r => r.lane && !isCurtain(lookup, styleOf(lookup, r.style).name)).map(r => key(r.lane)));
  const laneDiffs = [];
  let lanesGone = [];
  if (sheetLanes.length) {
    const inSheet = new Set(sheetLanes.map(l => key(l.name)));
    lanesGone = P.lanes.filter(l => !inSheet.has(key(l.name)) && !rowLanes.has(key(l.name)));
    for (const sl of sheetLanes) {
      const cur = P.lanes.find(l => key(l.name) === key(sl.name));
      if (!cur) laneDiffs.push([sl.name, "New lane", null, sl.name]);
      else if (sl.colour && sl.colour.toUpperCase() !== String(cur.colour).toUpperCase()) laneDiffs.push([cur.name, "Lane colour", cur.colour, sl.colour]);
    }
    const kept = P.lanes.filter(l => inSheet.has(key(l.name))).map(l => key(l.name)), wanted = sheetLanes.map(l => key(l.name)).filter(n => kept.includes(n));
    if (kept.join("|") !== wanted.join("|")) laneDiffs.push(["", "Lane order", null, sheetLanes.map(l => l.name).join(" → ")]);
  }
  const removable = missing.length + lanesGone.length;

  const tr = (id, what, from, to) => `<tr><td>${esc(id)}</td><td>${esc(what)}</td><td>${from != null ? `<span class="old">${esc(from)}</span> → ` : ""}${esc(to)}</td></tr>`;
  const body = [
    ...(ddChange ? [tr("", "Data date", prog().dataDate ? fmt(prog().dataDate) : "(none)", ddNew ? fmt(ddNew) : "(none)")] : []),
    ...newTypes.map(s => tr(s.name, `New ${s.behaviour === "Move" ? "milestone" : "bar"} type`, null, s.notes)),
    ...laneDiffs.map(d => tr(...d)),
    ...changes.flatMap(c => c.diffs.map((d, k) => tr(k ? "" : c.cur.id, d[0], d[1], d[2]))),
    ...adds.map(a => tr(a.id || "(new)", "New item", null, `${a.name} · ${a.lane || "Unassigned"} · ${fmt(a.start)}`)),
    ...dupes.map(d => tr(d.id, "Duplicate ShapeID", null, `Excel row ${d.xlRow} “${d.name}” added with a new ID`)),
    ...lanesGone.map(l => tr(l.name, "Lane not in workbook", null, `${P.items.filter(i => i.lane === l.id).length} item(s) in it`)),
    ...missing.map(m => tr(m.id, "Not in workbook", null, `${m.name}${m.lane ? " · " + laneName(m.lane) : ""}`)),
    ...parsed.problems.map(p => `<tr><td></td><td>Skipped</td><td>${esc(p)}</td></tr>`),
  ].join("");
  const nothing = !changes.length && !adds.length && !dupes.length && !newTypes.length && !laneDiffs.length && !ddChange;
  const removeLabel = [missing.length && `${missing.length} item${missing.length > 1 ? "s" : ""}`, lanesGone.length && `${lanesGone.length} lane${lanesGone.length > 1 ? "s" : ""}`].filter(Boolean).join(" and ");
  showModal(`
    <header><h3>Update from ${esc(fname)}</h3><p>Rows are matched to the programme by ShapeID. Positions and colours you set on the sheet are kept.</p></header>
    <div class="body">
      <div class="chips">
        ${newTypes.length ? `<span class="chip new">${newTypes.length} new type${newTypes.length > 1 ? "s" : ""}</span>` : ""}<span class="chip chg">${changes.length} changed</span><span class="chip new">${adds.length + dupes.length} new</span>
        ${laneDiffs.length ? `<span class="chip chg">${laneDiffs.length} lane change${laneDiffs.length > 1 ? "s" : ""}</span>` : ""}
        <span class="chip miss">${removable} removed in workbook</span>${parsed.problems.length ? `<span class="chip err">${parsed.problems.length} skipped</span>` : ""}
      </div>
      ${body ? `<div style="overflow-x:auto"><table class="diff"><thead><tr><th>ShapeID / lane</th><th>Change</th><th>Detail</th></tr></thead><tbody>${body}</tbody></table></div>` : `<p class="note">The workbook matches the programme. Nothing to update.</p>`}
    </div>
    <footer>
      ${removable ? `<label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="impDel" ${parsed.fromTool ? "checked" : ""}> Remove the ${removeLabel} no longer in the workbook</label>` : ""}
      <span class="spacer" style="flex:1"></span>
      <button class="btn" data-act="close">Cancel</button>
      <button class="btn primary" data-act="apply" ${nothing && !removable ? "disabled" : ""}>Apply update</button>
    </footer>`, {
    apply: m => {
      const del = m.querySelector("#impDel")?.checked;
      commit(p => {
        p.styles.push(...clone(newTypes));
        const laneFor = name => { let l = p.lanes.find(x => x.name.toLowerCase() === name.toLowerCase()); if (!l) l = newLane(p, name); return l.id; };
        for (const c of changes) {
          const it = p.items.find(i => i.id === c.cur.id), r = c.r, st = styleOf(p, r.style).name;
          const oldLane = it.lane;
          Object.assign(it, { name: r.name || it.name, start: r.start, end: isMs(p, st) ? r.start : r.end, style: st, status: r.status || it.status });
          if (r.fill) it.fill = r.fill; if (r.stroke) it.stroke = r.stroke;
          if (r.lane) { it.lane = laneFor(r.lane); if (it.lane !== oldLane) it.row = freeRow(p, it); }
          if (Number.isFinite(r.row)) it.row = r.row;
          if (r.parent !== undefined) { if (r.parent) it.parent = r.parent; else delete it.parent; }
          if (r.collapsed !== undefined) it.collapsed = r.collapsed;
          if (r.labelMode) { if (r.labelMode === "auto") delete it.labelMode; else it.labelMode = r.labelMode; }
          if (tracked(it)) {
            if (r.pct !== undefined) { if (r.pct) it.pct = r.pct; else delete it.pct; }
            if (r.bStart !== undefined) { if (r.bStart) { it.bStart = r.bStart; it.bEnd = isMs(p, st) ? r.bStart : (r.bEnd || r.bStart); } else { delete it.bStart; delete it.bEnd; } }
          }
        }
        if (ddChange) p.progress = { ...prog(), ...(p.progress || {}), dataDate: ddNew };
        const reserved = new Set(parsed.rows.map(r => r.id).filter(Boolean));
        for (const r of [...adds, ...dupes]) {
          const st = styleOf(p, r.style).name;
          const id = r.id && !p.items.some(i => i.id === r.id) ? r.id : nextId(p, st, r.id || null, reserved);
          const curtain = isCurtain(p, st);
          const it = { id, name: r.name, style: st, lane: curtain ? "" : laneFor(r.lane || "Unassigned"), start: r.start, end: isMs(p, st) ? r.start : r.end, status: r.status, row: 0, fill: r.fill, stroke: r.stroke };
          if (r.parent) it.parent = r.parent;
          if (r.collapsed) it.collapsed = true;
          if (!curtain && r.pct) it.pct = r.pct;
          if (!curtain && r.bStart) { it.bStart = r.bStart; it.bEnd = isMs(p, st) ? r.bStart : (r.bEnd || r.bStart); }
          it.row = curtain ? 0 : Number.isFinite(r.row) ? r.row : freeRow(p, it);
          p.items.push(it);
        }
        // lanes from the Lanes sheet: create missing ones, apply colours, then put them in the sheet's order
        if (sheetLanes.length) {
          for (const sl of sheetLanes) {
            const l = p.lanes.find(x => key(x.name) === key(sl.name)) || p.lanes.find(x => x.id === laneFor(sl.name));
            if (sl.colour) l.colour = sl.colour;
            if (sl.minRows) l.minRows = sl.minRows;
          }
          const order = sheetLanes.map(sl => key(sl.name));
          const rank = l => { const i = order.indexOf(key(l.name)); return i < 0 ? order.length : i; };
          p.lanes = p.lanes.map((l, i) => [l, i]).sort((a, b) => rank(a[0]) - rank(b[0]) || a[1] - b[1]).map(x => x[0]);

        if (del) {
          const gone = new Set(missing.map(x => x.id)), goneLanes = new Set(lanesGone.map(l => l.id));
          p.items = p.items.filter(i => !gone.has(i.id) && !goneLanes.has(i.lane));
          p.lanes = p.lanes.filter(l => !goneLanes.has(l.id));
        }
      });
      toast(`Updated ${changes.length}, added ${adds.length + dupes.length}${laneDiffs.length ? `, ${laneDiffs.length} lane change${laneDiffs.length > 1 ? "s" : ""}` : ""}${del && removable ? `, removed ${removeLabel}` : ""}.`, 5000);
    }
  });
}

/* =====================================================================
   PDF: the same SVG sheet, scaled onto A3 landscape as vectors
   ===================================================================== */
const FONT_URLS = {
  normal: "https://cdn.jsdelivr.net/gh/JulietaUla/Montserrat@master/fonts/ttf/Montserrat-Medium.ttf",
  bold: "https://cdn.jsdelivr.net/gh/JulietaUla/Montserrat@master/fonts/ttf/Montserrat-Bold.ttf",
};
let fontCache = null;
async function loadPdfFonts() {
  if (fontCache !== null) return fontCache;
  if (HOST && HOST.loadFonts) { try { fontCache = await HOST.loadFonts(); } catch (e) { fontCache = false; } return fontCache; }
  const b64 = buf => { const u = new Uint8Array(buf); let s = ""; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
  try {
    const [n, b] = await Promise.all([FONT_URLS.normal, FONT_URLS.bold].map(u => fetch(u).then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })));
    fontCache = { normal: b64(n), bold: b64(b) };
  } catch (e) { fontCache = false; }   // offline: fall back to Helvetica
  return fontCache;
}
async function exportPdf() {
  const btn = $("bPdf"); btn.disabled = true; btn.textContent = "Building PDF…";
  try {
    const { blob, fonts, fit } = await buildPdfBlob();
    download(blob, fileBase() + ".pdf");
    toast(`Exported ${fileBase()}.pdf (${pageName()}${fit < 0.98 ? `, content scaled to ${Math.round(fit * 100)}% to fit` : ""})` + (fonts ? "" : " · Helvetica: brand font unavailable offline"), 5000);
  } catch (err) { console.error(err); toast("PDF export failed: " + err.message, 5000); }
  finally { btn.disabled = false; btn.textContent = "Export PDF"; }
}
/* the PDF is the page view: same paper, margins, row spacing and scale */
async function buildPdfBlob() {
  const { jsPDF } = (HOST && HOST.jspdf) || window.jspdf;
  const { PW, PH } = paperMM();
  const doc = new jsPDF({ orientation: PW >= PH ? "landscape" : "portrait", unit: "mm", format: [PW, PH] });
  const fonts = await loadPdfFonts();
  let face = "helvetica";
  if (fonts) {
    doc.addFileToVFS("Montserrat-Medium.ttf", fonts.normal); doc.addFont("Montserrat-Medium.ttf", "Montserrat", "normal");
    doc.addFileToVFS("Montserrat-Bold.ttf", fonts.bold); doc.addFont("Montserrat-Bold.ttf", "Montserrat", "bold");
    face = "Montserrat";
  }
  const holder = document.createElement("div"); holder.style.cssText = "position:fixed;left:-99999px;top:0";
  const svg = document.createElementNS(NS, "svg"); holder.appendChild(svg); ROOT.appendChild(holder);
  try {
    const plan = drawPage(svg, { print: true, font: face }), { L, k, M, availW } = plan;
    const lib = (HOST && HOST.svg2pdf) || window.svg2pdf;
    const svgFn = lib?.svg2pdf || lib;
    await svgFn(svg, doc, { x: M + (availW - L.W * k) / 2, y: M, width: L.W * k, height: L.H * k });
    doc.setProperties({ title: `${P.meta.number} ${P.meta.title} PoaP Rev ${P.meta.revision}`, author: P.meta.author || "", creator: "PoaP Builder" });
    return { blob: doc.output("blob"), fonts, fit: plan.fit };
  } finally { holder.remove(); }
}

/* =====================================================================
   Saving. DOC is where this programme is saved, or null when it isn't saved anywhere yet:
     { kind: "library", path, name, etag, base, savedAt }      SharePoint library (with a host)
     { kind: "file", handle, name, lastMod, base, savedAt }    a file on this computer (Edge/Chrome)
     { kind: "download", name, base, savedAt }                 browsers that can only download
   base is the programme as last saved, so we can tell unsaved changes and merge others' edits.
   ===================================================================== */
const timeAgo = iso => { const m = Math.round((Date.now() - new Date(iso)) / 6e4); return m < 1 ? "just now" : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : new Date(iso).toLocaleDateString("en-AU"); };

const canPickFiles = !HOST && "showSaveFilePicker" in window;
/* the title block (number, title, revision) as it was when this file was opened or last named;
   a change suggests a new revision file, but never stops auto-save. The file's own name can be anything. */
const titleChanged = () => !!DOC && !!DOC.titleKey && DOC.kind !== "download" && DOC.titleKey !== fileBase();
function showStatus() {
  const box = $("saveStatus"), s = $("saved"), btn = $("bSaveNow"); if (!box) return;
  const dirty = isDirty();
  let state, text, button = "";
  if (saving) { state = "saving"; text = "Saving…"; }
  else if (!DOC) { state = "none"; text = HOST ? "Not saved to the library" : "Not saved"; button = "Save now"; }
  else if (dirty && DOC.kind === "download") { state = "pending"; text = `Changes since ${clock(DOC.savedAt)} download`; button = "Save now"; }
  else if (dirty) { state = "pending"; text = "Unsaved changes · saving in a few seconds"; }
  else { state = "saved"; text = `All changes saved ${clock(DOC.savedAt)}`; }
  if (!saving && titleChanged()) { text += " · title block changed"; button = "Save as new file…"; }
  box.dataset.state = state; s.textContent = text; btn.hidden = !button; if (button) btn.textContent = button;
  box.title = DOC ? `Saved to ${HOST ? DOC.path : DOC.kind === "file" ? DOC.name + " on this computer" : "your downloads as " + DOC.name}${DOC.kind === "download" ? "" : ". Changes save automatically."}` : "Save once and every change after that is saved automatically.";
}
function loadDoc(project, doc) {
  P = upgradeProject(project); DOC = doc; past = []; future = []; sel = null; touched = false;
  if (DOC && !DOC.titleKey) DOC.titleKey = fileBase();
  rememberProjectBrand();
  try { localStorage.setItem(STORE, JSON.stringify(P)); } catch (e) {}
  rememberFile();
  render(); renderSide(); showStatus();

/* Before New or Open replaces the current programme: make sure nothing is lost. */
async function guardUnsaved(next) {
  while (saving) await new Promise(r => setTimeout(r, 100));
  if (DOC && DOC.kind !== "download" && isDirty()) { if (await saveDoc()) next(); return; }
  if ((!DOC && touched) || (DOC?.kind === "download" && isDirty())) {
    return showModal(`<header><h3>Save this programme first?</h3><p>${DOC ? "Your latest changes haven't been downloaded." : "It hasn't been saved anywhere yet."} If you continue without saving, those changes are lost.</p></header>
      <footer><button class="btn danger" data-act="discard">Don't save</button><span class="spacer" style="flex:1"></span><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="save">Save</button></footer>`,
      { discard: () => next(), save: () => { saveDoc().then(ok => ok && next()); } });
  }

}
/* Ask for the first save straight away, so auto-save protects the work from the start. */
function promptFirstSave(why) {

  showModal(`<header><h3>Save before you start</h3><p>${esc(why)} Save it to ${dest} now; ${HOST || canPickFiles ? "after that every change is saved automatically" : "this browser can't save automatically, so download again after changes"}. Or open a programme you saved before.</p></header>
    <footer><button class="btn" data-act="open">Open a saved programme…</button><span class="spacer" style="flex:1"></span><button class="btn" data-act="close">Later</button><button class="btn primary" data-act="save">Save now</button></footer>`,
    { save: () => { saveDoc(); }, open: () => { $("bOpen").click(); } });
}
async function flushSave() {

}

/* Someone else saved since we last did: offer to combine their version with ours. */
function conflictPrompt(theirs, { loadTheirs, saveMerged }) {
  const m = merge3(JSON.parse(DOC.base), P, JSON.parse(theirs.text));
  showModal(`<header><h3>${esc(theirs.by || "Someone")} saved this programme ${esc(timeAgo(theirs.modified))}</h3>
      <p>Your changes and theirs can be combined. ${m.both ? `<b>${m.both}</b> item${m.both > 1 ? "s were" : " was"} changed by both of you; your version is kept for ${m.both > 1 ? "those" : "it"}.` : "None of the same items were changed by both of you."}</p></header>
    <div class="body"><div class="chips"><span class="chip chg">${m.mine} of your changes</span><span class="chip new">${m.theirs} of theirs</span>${m.both ? `<span class="chip miss">${m.both} changed by both</span>` : ""}</div></div>
    <footer><button class="btn" data-act="theirs">Discard mine, load theirs</button><span class="spacer" style="flex:1"></span><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="merge">Save combined version</button></footer>`, {
    theirs: () => { loadTheirs(JSON.parse(theirs.text)); toast("Loaded the latest version."); },
    merge: () => { past.push(JSON.stringify(P)); future = []; P = m.project; saveMerged(JSON.stringify(JSON.parse(theirs.text))); render(); renderSide(); saveDoc(); },
  });

/* ---------- files on this computer (no host) ---------- */
const FILE_TYPES = [{ description: "PoaP Builder programme", accept: { "application/json": [".json"] } }];

async function fileSave(opts = {}) {

    return new Promise(done => showModal(`<header><h3>Save as a new file?</h3><p>The title block now reads “${esc(fileBase())}” (it was “${esc(DOC.titleKey)}”). A new file keeps “${esc(DOC.name)}” as it was, which suits a new revision. Keeping the old file saves the changes into it.</p></header>
      <footer><span class="spacer" style="flex:1"></span><button class="btn" data-act="close">Cancel</button><button class="btn" data-act="keep">Keep the old file</button><button class="btn primary" data-act="new">Save as new file</button></footer>`, {
      keep: () => { fileSave({ keepName: true }).then(done); },
      new: () => { fileSave({ newFile: true }).then(done); },
      close: () => done(false),
    }));
  }

    let handle = DOC?.kind === "file" && !opts.newFile ? DOC.handle : null;

      catch (e) { if (e.name === "AbortError") return false; throw e; }
    } else {

        else onDisk = text;
      }
      if (onDisk !== null) {
        const theirs = { text: onDisk, modified: new Date(f.lastModified).toISOString(), by: "Someone" };
        conflictPrompt(theirs, {
          loadTheirs: t => loadDoc(t, { ...DOC, base: JSON.stringify(t), lastMod: f.lastModified, savedAt: theirs.modified }),
          saveMerged: base => { DOC = { ...DOC, base, lastMod: f.lastModified }; },

    if (!opts.auto) toast("Saved " + f.name + ". Changes now save automatically.");
    return true;
  } catch (err) { toast((opts.auto ? "Auto-save failed: " : "Couldn't save: ") + err.message + ". Your changes are kept in this browser; press Save to retry.", 6000); return false; }
}

/* Remember the file between visits (the browser keeps the handle; it asks again for permission). */
const idb = () => new Promise((res, rej) => { const r = indexedDB.open("poap-builder", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
async function idbSet(key, value) { try { const db = await idb(); const tx = db.transaction("kv", "readwrite"); value == null ? tx.objectStore("kv").delete(key) : tx.objectStore("kv").put(value, key); } catch (e) {} }
async function idbGet(key) { try { const db = await idb(); return await new Promise(res => { const r = db.transaction("kv").objectStore("kv").get(key); r.onsuccess = () => res(r.result); r.onerror = () => res(null); }); } catch (e) { return null; } }
function rememberFile() {
  if (HOST) {   // the library file: path and the version we last saved
    try { DOC?.kind === "library" ? localStorage.setItem(STORE + ":doc", JSON.stringify(DOC)) : localStorage.removeItem(STORE + ":doc"); } catch (e) {}
    return;
  }
  if (!("indexedDB" in window)) return;
  idbSet("doc", DOC?.kind === "file" ? { handle: DOC.handle, name: DOC.name, lastMod: DOC.lastMod, base: DOC.base, savedAt: DOC.savedAt, titleKey: DOC.titleKey } : null);
}
/* SharePoint: carry on with the programme last used from the library (this browser's draft wins if newer) */
async function reconnectLibrary(last) {
  const unsaved = JSON.stringify(P) !== last.base;
  try {
    const r = await HOST.read(last.path);
    DOC = { ...last };
    if (r.etag !== last.etag && !unsaved) { const t = JSON.parse(r.text); loadDoc(t, { ...last, etag: r.etag, base: JSON.stringify(t), savedAt: r.modified }); }
    else { showStatus(); if (unsaved || r.etag !== last.etag) saveDoc(); }   // a changed etag ends in the merge prompt
    toast("Continuing with " + last.name);
  } catch (err) { toast("Couldn't load it from the library: " + err.message, 6000); try { localStorage.removeItem(STORE + ":doc"); } catch (e) {} }
}
/* this computer: reconnect to the file last saved, so changes keep saving to it */
async function reconnectFile(last) {
  const unsaved = JSON.stringify(P) !== last.base;
  try {
    if ((await last.handle.requestPermission({ mode: "readwrite" })) !== "granted") return toast("Permission to the file wasn't given, so changes won't save to it.", 5000);
    DOC = { kind: "file", handle: last.handle, name: last.name, lastMod: last.lastMod, base: last.base, savedAt: last.savedAt, titleKey: last.titleKey || fileBase() };
    const f = await last.handle.getFile();
    if (f.lastModified > last.lastMod + 1500 && !unsaved) {          // changed elsewhere, nothing new here: just load it
      const t = JSON.parse(await f.text()); loadDoc(t, { ...DOC, base: JSON.stringify(t), lastMod: f.lastModified, savedAt: new Date(f.lastModified).toISOString() });
    } else { showStatus(); if (unsaved || f.lastModified > last.lastMod + 1500) saveDoc(); }
    toast("Connected to " + last.name);
  } catch (err) { toast("Couldn't reconnect: " + err.message + ". Use Open to pick the file.", 6000); idbSet("doc", null); }
}

/* ---------- start screen: what to work on, over a blurred view of the sheet ---------- */
const START_ICONS = {
  new: '<path d="M12 5v14M5 12h14"/>',
  open: '<path d="M3 7h6l2 2h10v10H3z"/>',
  continue: '<path d="M8 5l11 7-11 7z"/>',
  excel: '<path d="M4 4h16v16H4zM4 10h16M10 4v16"/>',
  example: '<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>',
};
async function showStartScreen() {
  ROOT.querySelectorAll(".startscreen").forEach(s => s.remove());
  // what can be continued: the library file, the file on this computer, or an unsaved draft in this browser
  let last = null, lastKind = null;
  if (HOST) { try { last = JSON.parse(localStorage.getItem(STORE + ":doc")); if (last) lastKind = "library"; } catch (e) {} }
  else if (canPickFiles) { const f = await idbGet("doc"); if (f && f.handle) { last = f; lastKind = "file"; } }
  const draft = !last && hadDraft && P.items.length;
  const name = s => esc(String(s || "").replace(/\.poap\.json$/i, ""));
  const choice = (act, icon, title, sub, primary) => `<button type="button" class="choice${primary ? " primary" : ""}" data-start="${act}">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">${START_ICONS[icon]}</svg>
      <span><b>${title}</b><span class="note">${sub}</span></span></button>`;
  const where = HOST ? `the “${esc(HOST.libraryTitle)}” library` : canPickFiles ? "a file you choose (e.g. a OneDrive or SharePoint folder)" : "your downloads";
  const s = document.createElement("div");
  s.className = "startscreen"; s.setAttribute("role", "dialog"); s.setAttribute("aria-modal", "true"); s.setAttribute("aria-label", "Start");
  s.innerHTML = `<div class="startcard">
    <div class="starthead">
      <div><h2>PoaP Builder</h2><p class="note">Program of Activities and Possessions, ready to print on A3.</p></div>
      <button type="button" class="brandpick" data-start="brand" title="Change branding"><span class="logo"><img src="${brandLogoSrc()}" alt=""></span><span class="bname">${esc(currentBrand().name)}</span><span class="caret" aria-hidden="true">▾</span></button>
    </div>
    <div class="choices">
      ${last ? choice("continue", "continue", `Continue “${name(last.name)}”`, `Last saved ${esc(timeAgo(last.savedAt))}${lastKind === "library" ? ` in ${esc(HOST.libraryTitle)}` : ", on this computer"}.`, true) : ""}
      ${draft ? choice("draft", "continue", `Continue “${name(P.meta.title)}”`, "Unsaved work kept in this browser.", true) : ""}
      ${choice("new", "new", "New programme", `Start blank. You'll pick where to save it in ${where}; after that it saves itself.`, !last && !draft)}
      ${choice("open", "open", "Open a saved programme…", HOST ? `From ${esc(HOST.libraryTitle)} or your computer.` : "A .poap.json file.")}
      ${choice("excel", "excel", "Start from an Excel workbook…", "A programme exported from PoaP Builder, or the older Visio workbook.")}
      ${choice("example", "example", "Explore the example", "A sample programme to try things out. Nothing is saved until you choose to.")}
    </div>
    ${!HOST && !canPickFiles ? `<p class="note warnnote">This browser can't save to a file automatically; Save downloads a copy instead. Use Microsoft Edge or Google Chrome for auto-save.</p>` : ""}
  </div>`;
  ROOT.appendChild(s);
  const close = () => s.remove();
  s.querySelector('[data-start]').focus();
  s.addEventListener("keydown", e => { if (e.key === "Escape") close(); });
  s.querySelectorAll("[data-start]").forEach(b => b.onclick = () => {
    const a = b.dataset.start;
    if (a === "brand") return openBrandMenu();
    close();
    if (a === "continue") return lastKind === "library" ? reconnectLibrary(last) : reconnectFile(last);
    if (a === "draft") return toast("This programme isn't saved yet. Press Save to keep it in a file.", 5000);
    if (a === "new") return startNew(blankProject());
    if (a === "open") return HOST ? libraryOpen() : fileOpen();
    if (a === "excel") return $("fOpen").click();
    if (a === "example") return startNew(seedProject(), { example: true });
  });
}

/* the library is created on first use, then `then` carries on with whatever needed it */
function offerCreateLibrary(then) {
  return showModal(`<header><h3>No “${esc(HOST.libraryTitle)}” library yet</h3><p>Programmes are saved in a document library on this site. Create it now? Site owners and members with edit rights can do this.</p></header>
    <footer><span class="spacer" style="flex:1"></span><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="create">Create library</button></footer>`,
    { create: () => { HOST.createLibrary().then(() => { toast("Library created."); then(); }, e => toast("Couldn't create the library: " + e.message, 6000)); } });
}

async function libraryOpen() {
  let files;
  try { files = await HOST.list(); }
  catch (err) {
    if (err.missingLibrary) return offerCreateLibrary(libraryOpen);
    return toast("Couldn't read the library: " + err.message, 6000);
  }
  const rows = files.map((f, i) => `<tr data-open="${i}" style="cursor:pointer"><td>${esc(f.name.replace(/\.poap\.json$/i, ""))}</td><td>${esc(f.by || "")}</td><td>${esc(timeAgo(f.modified))}</td></tr>`).join("");
  showModal(`<header><h3>Open a programme</h3><p>From the “${esc(HOST.libraryTitle)}” library on this site.</p></header>
    <div class="body">${rows ? `<table class="diff"><thead><tr><th>Programme</th><th>Saved by</th><th>When</th></tr></thead><tbody>${rows}</tbody></table>` : `<p class="note">No programmes saved yet. Build one and press Save.</p>`}</div>
    <footer><button class="btn" data-act="file">From my computer (.json / .xlsx)…</button><span class="spacer" style="flex:1"></span><button class="btn" data-act="close">Cancel</button></footer>`,
    { file: () => { DOC = null; $("fOpen").click(); } });
  ROOT.querySelectorAll("[data-open]").forEach(tr => tr.onclick = async () => {
    const f = files[+tr.dataset.open]; tr.closest(".modal").remove();
    try {
      const r = await HOST.read(f.path), p = JSON.parse(r.text);
      if (p.format !== "poap/2") throw new Error("this file isn't a PoaP Builder project");
      loadDoc(p, { kind: "library", path: f.path, name: f.name, etag: r.etag, base: JSON.stringify(p), savedAt: r.modified || f.modified });
      toast("Opened " + f.name);
    } catch (err) { toast("Couldn't open " + f.name + ": " + err.message, 6000); }
  });
}

async function librarySave(opts = {}) {
  // project number, title or revision changed since the file was named: new file or same file?
  const prevKey = DOC?.titleKey;
  if (DOC && titleChanged() && !opts.keepName && !opts.auto) {
    return new Promise(done => showModal(`<header><h3>Save as a new file?</h3><p>The title block now reads “${esc(fileBase())}” (it was “${esc(DOC.titleKey)}”). A new file keeps “${esc(DOC.name)}” as it was, which suits a new revision. Keeping the old name saves the changes into it.</p></header>
      <footer><span class="spacer" style="flex:1"></span><button class="btn" data-act="close">Cancel</button><button class="btn" data-act="keep">Keep the old name</button><button class="btn primary" data-act="new">Save as new file</button></footer>`, {
      keep: () => { librarySave({ keepName: true }).then(done); },
      new: () => { DOC = null; librarySave().then(done); },
      close: () => done(false),
    }));
  }
  const text = JSON.stringify(P, null, 1), snapshot = JSON.stringify(P);
  const name = DOC ? DOC.name : fileBase() + ".poap.json";
  const path = DOC ? DOC.path : HOST.folderPath + "/" + name;
  try {
    const r = await HOST.write(path, text, DOC ? DOC.etag : null, !!opts.replace);
    if (r.exists) {   // a new programme whose name is already taken in the library
      return showModal(`<header><h3>“${esc(name)}” already exists</h3><p>Another programme in the library has this name. Replace it, or change the project number, title or revision first.</p></header>
        <footer><span class="spacer" style="flex:1"></span><button class="btn" data-act="close">Cancel</button><button class="btn danger" data-act="replace">Replace it</button></footer>`,
        { replace: () => { saveDoc({ replace: true }); } });
    }
    if (r.conflict) { await resolveConflict(path, name); return false; }
    DOC = { kind: "library", path, name, etag: r.etag, base: snapshot, savedAt: new Date().toISOString(), titleKey: opts.auto && prevKey ? prevKey : fileBase() };
    rememberFile();
    showStatus(); if (!opts.auto) toast("Saved " + name);
    return true;
  } catch (err) {
    if (err.missingLibrary && !opts.auto) { offerCreateLibrary(() => saveDoc(opts)); return false; }
    toast((opts.auto ? "Auto-save failed: " : "Couldn't save: ") + err.message + (opts.auto ? ". Your changes are kept; press Save to retry." : ""), 6000); return false;
  }
}

/* Someone saved since we opened: merge their version and ours against the version we opened. */
async function resolveConflict(path, name) {
  let theirs;
  try { theirs = await HOST.read(path); } catch (err) { return toast("Couldn't read the newer version: " + err.message, 6000); }
  conflictPrompt(theirs, {
    loadTheirs: t => loadDoc(t, { kind: "library", path, name, etag: theirs.etag, base: JSON.stringify(t), savedAt: theirs.modified }),
    saveMerged: base => { DOC = { ...DOC, etag: theirs.etag, base }; },
  });
}
function merge3(base, mine, theirs) {
  const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
  const out = clone(theirs); let nMine = 0, nTheirs = 0, both = 0;
  for (const part of ["meta", "timeline", "view", "progress"]) for (const k of new Set([...Object.keys(base[part] || {}), ...Object.keys(mine[part] || {})]))
    if (!same(mine[part]?.[k], base[part]?.[k])) { out[part] = out[part] || {}; out[part][k] = mine[part]?.[k]; nMine++; }
  const mergeList = (key, idOf) => {
    const map = arr => new Map((arr || []).map(x => [idOf(x), x]));
    const b = map(base[key]), m = map(mine[key]), t = map(theirs[key]);
    const order = [...(theirs[key] || []).map(idOf), ...(mine[key] || []).map(idOf).filter(id => !t.has(id))];
    // keep my lane/type order if I reordered and they didn't
    const ids = !same([...m.keys()], [...b.keys()]) && same([...t.keys()], [...b.keys()]) ? [...new Set([...m.keys(), ...order])] : order;
    const res = [];
    for (const id of ids) {
      const bi = b.get(id), mi = m.get(id), ti = t.get(id);
      if (!bi) { if (mi) { res.push(mi); if (!ti) nMine++; else if (!same(mi, ti)) both++; } else if (ti) { res.push(ti); nTheirs++; } continue; }
      const mc = !mi || !same(mi, bi), tc = !ti || !same(ti, bi);
      if (!mc) { if (ti) res.push(ti); if (tc) nTheirs++; }
      else if (!tc) { if (mi) res.push(mi); nMine++; }
      else { both++; const keep = mi || ti; if (keep) res.push(keep); }
    }
    out[key] = res;
  };
  mergeList("lanes", l => l.id); mergeList("styles", s => s.name); mergeList("items", i => i.id);
  return { project: out, mine: nMine, theirs: nTheirs, both };
}

async function libraryIssue() {
  const btn = $("bIssue"); btn.disabled = true; btn.textContent = "Issuing…";
  try {
    if (!(await flushSave())) return;
    const base = fileBase(), folder = HOST.folderPath + "/Issued";
    const { blob, fonts } = await buildPdfBlob();
    await HOST.writeFile(folder, base + ".pdf", blob);
    await HOST.writeFile(folder, base + ".xlsx", buildExcelBlob());
    toast(`Issued ${base} (PDF and Excel) to ${HOST.libraryTitle}/Issued` + (fonts ? "" : " · brand font unavailable, Helvetica used"), 5000);
  } catch (err) { toast("Couldn't issue: " + err.message, 6000); }
  finally { btn.disabled = false; btn.textContent = "Issue"; }
}
if (HOST) {
  $("bIssue").hidden = false;
  $("bIssue").onclick = libraryIssue;
  $("bSave").title = `Save to the “${HOST.libraryTitle}” library (Ctrl+S)`;
  $("bOpen").title = `Open a programme from the “${HOST.libraryTitle}” library`;
}

/* ===================================================================== */
document.fonts?.ready.then(() => { render(); });
render(); renderSide(); showStatus();
showStartScreen();
</script>
